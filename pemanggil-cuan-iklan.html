<!DOCTYPE html>
<!-- SUGIMATION AI - Pemanggil Cuan Iklan. Tempel file ini di Gemini Canvas. Aplikasinya selalu diambil dari GitHub (cabang main), jadi pembaruan otomatis ikut tanpa membuat link baru. -->
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUGIMATION AI - Cuan Iklan</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF3E3; color: #3B2A1A; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .spin { width: 40px; height: 40px; border: 4px solid #E9DCC2; border-top-color: #C9A24D; border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes s { to { transform: rotate(360deg); } }
  button { margin-top: 16px; background: #C9A24D; color: #3B2A1A; border: 0; border-radius: 14px; padding: 12px 24px; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<div id="msg"><div class="spin"></div><p>Memuat SUGIMATION AI...</p></div>
<script>
  const SUMBER = "https://raw.githubusercontent.com/elhabsyihauto-ai/Sugimation/main/cuan-iklan.html";
  async function muat() {
    document.getElementById("msg").innerHTML = '<div class="spin"></div><p>Memuat SUGIMATION AI...</p>';
    try {
      // ?v= membuat versi terbaru selalu terambil, bukan salinan lama
      const res = await fetch(SUMBER + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("Kode " + res.status);
      const html = await res.text();
      document.open(); document.write(html); document.close();
    } catch (e) {
      document.getElementById("msg").innerHTML = "<p><b>Aplikasi gagal dimuat.</b><br>Periksa koneksi internet, lalu coba lagi.</p><p style='font-size:12px;opacity:.7'>" + String(e.message || e) + "</p><button onclick='muat()'>Coba lagi</button>";
    }
  }
  muat();
</script>
</body>
</html>
